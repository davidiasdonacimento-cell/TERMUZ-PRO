name: TERMUZ PRO Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses and install SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Download and verify PRoot ARM64
        shell: bash
        run: |
          set -euo pipefail
          VERSION="v26.10.08-a179d3e"
          URL="https://github.com/ahmed-alnassif/proot/releases/download/${VERSION}/proot-aarch64.zip"
          SHA256="d621d71fb68bf07accbada37ffc4208cf4a963eed70916ee68f848cbd9555cc3"
          mkdir -p "$RUNNER_TEMP/proot" app/src/main/jniLibs/arm64-v8a
          curl -fL --retry 3 "$URL" -o "$RUNNER_TEMP/proot/p.zip"
          echo "$SHA256  $RUNNER_TEMP/proot/p.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/proot/p.zip" -d "$RUNNER_TEMP/proot/out"
          P="$(find "$RUNNER_TEMP/proot/out" -type f -name proot -print -quit)"
          L="$(find "$RUNNER_TEMP/proot/out" -type f -name loader -print -quit)"
          test -n "$P" && test -n "$L"
          install -m 0755 "$P" app/src/main/jniLibs/arm64-v8a/libproot.so
          install -m 0755 "$L" app/src/main/jniLibs/arm64-v8a/libproot-loader.so

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: TERMUZ-PRO-0.2.0-android-arm64
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
